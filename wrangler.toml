name = "cims-recruitment"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Two front doors on one worker (see src/config.js HOSTS for the split):
#   recruitment.cims.work — STAFF. Keyed monthly form (?k=FORM_KEY), admin console,
#                           reports, Ray/Rolando /decide links, /files/ downloads.
#   apply.cims.work       — PUBLIC. Candidate application + Big Five verification.
#                           The address that goes on job ads and referral cards.
# The router in src/worker.js refuses staff paths on the public host, so a WAF
# rate rule can cover apply.cims.work wholesale without throttling the team.
routes = [
  { pattern = "recruitment.cims.work", custom_domain = true },
  { pattern = "apply.cims.work", custom_domain = true }
]

# READ-ONLY access to the CIMS HR console database for Part 2 prefill.
# The worker only ever runs fixed SELECT statements (see src/consoleData.js);
# it never writes to this database.
[[d1_databases]]
binding = "CONSOLE_DB"
database_name = "cims-hr-console"
database_id = "f0ac8b6a-deac-4214-8f42-e22b202d7d7d"

# Resume storage for the applicant funnel. Files served only via unguessable
# /files/<uuid> URLs generated by the worker.
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "cims-resumes"

# Central mail transport — every email leaves through cims-mailer (mail_log,
# outbox retries, sender governance). The sender identity
# "CIMS Recruitment <recruitment@cims.work>" is registered in the mailer's
# ALLOWED_FROM. Once this binding is verified live, the RESEND_API_KEY secret
# on THIS worker is dead weight and should be deleted (the mailer holds the
# only Resend key in the estate).
[[services]]
binding = "MAILER"
service = "cims-mailer"

# Crons (UTC). 01:00 UTC = 09:00 Asia/Manila.
#  - Monday 01:00 UTC  -> invitation email to both admins (first Monday only; code checks the date)
#  - Thursday 01:00 UTC -> reminder (Thursday after the first Monday, only if not submitted)
#  - Daily 02:00 UTC   -> applicant funnel sweep (7-day test reminder, 30-day auto-expiry)
[triggers]
crons = ["0 1 * * MON", "0 1 * * THU", "0 2 * * *"]

# Secrets (Cloudflare dashboard -> Workers -> cims-recruitment -> Settings -> Variables & Secrets):
#   AIRTABLE_TOKEN   - Airtable PAT, scoped to "TDG Recruitment Pipeline", data.records:read+write
#   RESEND_API_KEY   - Resend key
#   FORM_KEY         - the secret in the bookmark link, e.g. recruitment.cims.work/?k=<FORM_KEY>
